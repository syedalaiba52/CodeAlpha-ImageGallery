<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mediaQueries.css" />

    <!-- Fontawesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Wrapper -->
    <div class="wrapper">
      <div class="gallery">
        <div class="image">
          <span><img src="/images/nature (6).jpg" alt=" nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (1).jpg" alt="nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/Birds (1).jpg" alt=" birds image" /></span>
        </div>
        <div class="image">
          <span
            ><img src="/images/illustration (1).jpg" alt="illustration image"
          /></span>
        </div>
        <div class="image">
          <span><img src="/images/Birds (2).jpg" alt=" birds image" /></span>
        </div>
        <div class="image">
          <span
            ><img src="/images/illustration (2).jpg" alt="illustration image"
          /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (2).jpg" alt="nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (7).jpg" alt=" nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (3).jpg" alt="nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (8).jpg" alt=" nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/Birds (3).jpg" alt=" birds image" /></span>
        </div>
        <div class="image">
          <span
            ><img src="/images/illustration (3).jpg" alt="illustration image"
          /></span>
        </div>
        <div class="image">
          <span><img src="/images/Birds (5).jpg" alt=" birds image" /></span>
        </div>
        <div class="image">
          <span
            ><img src="/images/illustration (5).jpg" alt="illustration image"
          /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (4).jpg" alt="nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (10).jpg" alt=" nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (5).jpg" alt="nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (9).jpg" alt=" nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/Birds (4).jpg" alt=" birds image" /></span>
        </div>
        <div class="image">
          <span
            ><img src="/images/illustration (4).jpg" alt="illustration image"
          /></span>
        </div>
        <div class="image">
          <span><img src="/images/Birds (6).jpg" alt="nature image" /></span>
        </div>
        <div class="image">
          <span
            ><img src="/images/illustration (6).jpg" alt="nature image"
          /></span>
        </div>

        <div class="image">
          <span><img src="/images/nature (11).jpg" alt="nature image" /></span>
        </div>
        <div class="image">
          <span><img src="/images/nature (12).jpg" alt="nature image" /></span>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-box">
      <div class="details">
        <span class="title">
          Image
          <p class="current-img">11</p>
          of
          <p class="total-img">22</p>
        </span>

        <span class="icon fa-solid fa-xmark"></span>
      </div>
      <div class="img-box">
        <div class="slide prev">
          <i class="fa-solid fa-angle-left"></i>
        </div>
        <div class="slide next">
          <i class="fa-solid fa-angle-right"></i>
        </div>

        <img src="" alt="" />
      </div>
    </div>
    <!-- JS -->
    <script src="script.js"></script>
  </body>
</html>
