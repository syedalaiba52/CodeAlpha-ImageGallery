<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar using Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- IONICONS -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body
    class="font-[Poppins] bg-gradient-to-t from-[#fbc2eb] to-[#a6c1ee] h-screen"
  >
    <header class="bg-white">
      <nav class="flex items-center justify-between w-[92%] mx-auto">
        <div class="logo">
          <img
            class="w-16"
            src="https://cdn-icons-png.flaticon.com/512/5968/5968204.png"
            alt="logo"
          />
        </div>

        <div
          class="nav-links bg-white absolute md:static min-h-[60vh] md:min-h-fit left-0 top-[-100%] w-full md:w-auto flex items-center px-5"
        >
          <ul
            class="flex md:items-center gap-8 md:gap-[4vw] flex-col md:flex-row"
          >
            <li>
              <a class="hover:text-gray-500" href="#">Home</a>
            </li>
            <li>
              <a class="hover:text-gray-500" href="#">Products</a>
            </li>
            <li>
              <a class="hover:text-gray-500" href="#">Solution</a>
            </li>
            <li>
              <a class="hover:text-gray-500" href="#">Resources</a>
            </li>
            <li>
              <a class="hover:text-gray-500" href="#">Developers</a>
            </li>
            <li>
              <a class="hover:text-gray-500" href="#">Pricing</a>
            </li>
          </ul>
        </div>

        <div class="nav-btn">
          <button
            class="bg-[#a1c1ee] text-white px-5 py-2 rounded-full hover:bg-[#87acec]"
          >
            Sign in
          </button>
        </div>
      </nav>
    </header>
  </body>
</html>
